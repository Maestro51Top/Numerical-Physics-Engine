[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-physics-engine"
version = "0.1.0"
description = "A Python framework for numerical simulation and analysis of physical systems."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]